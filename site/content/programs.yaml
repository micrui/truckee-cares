title: {en: Our programs, es: Nuestros programas}
sections:
  - title: {en: Grocery gift cards, es: Tarjetas para el súper}
    body:
      en: >
        Families receive gift cards to local markets so they can buy the food that fits their family
        and their holiday meal. We no longer collect food items. Cash donations fund this program.
      es: >
        Las familias reciben tarjetas de regalo para mercados locales y así comprar la comida que
        va con su familia y su cena de fiestas. Ya no recolectamos alimentos. Las donaciones en
        efectivo pagan este programa.
  - title: {en: Toy drive, es: Colecta de juguetes}
    body:
      en: >
        Every child gets a new toy or gift. The drive is run by Soroptimist International of Truckee
        Donner. Look for the Toys for Tots barrels around town through December 11. Gifts for teens
        are always short: gift cards, beanies, gloves, backpacks, Bluetooth speakers, movie passes.
        No books, stuffed animals, toy guns, or unpackaged items. Questions: toydrive@sitd.info.
      es: >
        Cada niño recibe un juguete o regalo nuevo. La colecta la organiza Soroptimist International
        of Truckee Donner. Busque los barriles de Toys for Tots por el pueblo hasta el 11 de diciembre.
        Siempre faltan regalos para adolescentes: tarjetas de regalo, gorros, guantes, mochilas,
        bocinas Bluetooth, boletos de cine. No libros, peluches, pistolas de juguete ni artículos sin empaque.
  - title: {en: Coat drive, es: Colecta de abrigos}
    body:
      en: >
        Warm, clean, gently used coats (no holes or broken zippers) can be dropped at bins around town
        through December 11. Contact Kristi Morgan, (530) 448-0544, gkmorgan1424@gmail.com.
      es: >
        Abrigos limpios, abrigados y en buen estado (sin hoyos ni cierres rotos) se pueden dejar en los
        contenedores por el pueblo hasta el 11 de diciembre. Contacto: Kristi Morgan, (530) 448-0544.
  - title: {en: Seniors, es: Personas mayores}
    body:
      en: >
        Low-income and home-bound seniors receive grocery gift cards through Sierra Senior Services.
        Seniors do not need to fill out the family application.
      es: >
        Personas mayores de bajos ingresos o que no pueden salir de casa reciben tarjetas para el súper
        a través de Sierra Senior Services. No necesitan llenar la solicitud familiar.
