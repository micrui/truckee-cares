title: {en: Privacy, es: Privacidad}
sections:
  - title: {en: What we collect, es: Qué recopilamos}
    body:
      en: >
        Only what we need to help your family: your name, a phone number, where you live, where to
        mail your card, and your children's first names, ages and sex so we can pick the right toy
        and coat. We never ask about immigration status, income documents, Social Security numbers,
        or dates of birth.
      es: >
        Solo lo necesario para ayudar a su familia: su nombre, un teléfono, dónde vive, dónde enviar su
        tarjeta, y los nombres, edades y sexo de sus hijos para escoger el juguete y el abrigo correctos.
        Nunca preguntamos sobre estatus migratorio, comprobantes de ingresos, número de seguro social ni
        fechas de nacimiento.
  - title: {en: How it is protected, es: Cómo se protege}
    body:
      en: >
        The application you send is encrypted on your phone before it leaves, using a key that only
        Truckee Community Cares volunteers hold. The company that stores it for us holds only the
        locked copy and cannot read it. This site uses no trackers, no analytics, and no advertising.
      es: >
        La solicitud que envía se cifra en su celular antes de salir, con una llave que solo tienen
        los voluntarios de Truckee Community Cares. La empresa que la guarda por nosotros solo tiene
        la copia cerrada y no puede leerla. Este sitio no usa rastreadores, ni analítica, ni publicidad.
  - title: {en: If you use the microphone or the help chat, es: Si usa el micrófono o el chat de ayuda}
    body:
      en: >
        The form has a microphone, a help chat, and a box where you can tell us in your own words.
        They are optional. If you use them, what you say or type is sent to a speech-to-text service
        and a language service (OpenAI and Anthropic) so it can fill in the form or answer your
        question. Truckee Community Cares does not store what you say or type there. The finished
        application is still encrypted on your phone before it is sent. If you would rather not use
        these, type into the form fields directly.
      es: >
        El formulario tiene un micrófono, un chat de ayuda y un cuadro donde puede contarnos con sus
        propias palabras. Son opcionales. Si los usa, lo que dice o escribe se envía a un servicio de
        voz a texto y a un servicio de lenguaje (OpenAI y Anthropic) para llenar el formulario o
        responder su pregunta. Truckee Community Cares no guarda lo que dice o escribe ahí. La
        solicitud terminada se cifra en su celular antes de enviarse, igual que siempre. Si prefiere
        no usarlos, escriba directamente en los campos del formulario.
  - title: {en: How long we keep it, es: Cuánto tiempo la guardamos}
    body:
      en: >
        The copy on the internet is deleted after distribution day. One volunteer's computer keeps
        your application until the next season's applications have been matched, so we can recognize
        families who come back. Then it is deleted.
      es: >
        La copia en internet se borra después del día de entrega. La computadora de un voluntario
        guarda su solicitud hasta que se revisen las solicitudes de la siguiente temporada, para
        reconocer a las familias que regresan. Después se borra.
  - title: {en: Who to ask, es: A quién preguntar}
    body:
      en: Text (530) 479-2050 or email info@truckeecommunitycares.com.
      es: Mande un texto al (530) 479-2050 o escriba a info@truckeecommunitycares.com.
