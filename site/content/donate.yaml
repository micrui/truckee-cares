title: {en: Ways to give, es: Formas de donar}
sections:
  - title: {en: Online, es: En línea}
    body:
      en: >
        Give by card or PayPal. [Donate now](https://www.paypal.com/donate/?hosted_button_id=4FXL7GMNS9JGE).
      es: >
        Done con tarjeta o PayPal. [Donar ahora](https://www.paypal.com/donate/?hosted_button_id=4FXL7GMNS9JGE).
  - title: {en: By mail, es: Por correo}
    body:
      en: >
        Make checks payable to Truckee Community Cares and mail to P.O. Box 2955, Truckee, CA 96160.
      es: >
        Haga su cheque a nombre de Truckee Community Cares y envíelo a P.O. Box 2955, Truckee, CA 96160.
  - title: {en: In person, es: En persona}
    body:
      en: >
        Drop new toys and clean coats in the bins around town. See [Programs](../programs/) for the list.
      es: >
        Deje juguetes nuevos y abrigos limpios en los contenedores por el pueblo. Vea [Programas](../programs/).
