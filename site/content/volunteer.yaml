title: {en: Get involved, es: Participe}
sections:
  - title: {en: Toy drive, es: Colecta de juguetes}
    body:
      en: To help with the toy drive, email toydrive@sitd.info or text (530) 479-2050.
      es: Para ayudar con la colecta de juguetes, escriba a toydrive@sitd.info o mande un texto al (530) 479-2050.
  - title: {en: Grocery cards, es: Tarjetas para el súper}
    body:
      en: We fund grocery cards instead of collecting food. A cash gift is the best way to help. See [Donate](../donate/).
      es: Financiamos tarjetas en vez de recolectar comida. Una donación es la mejor forma de ayudar. Vea [Donar](../donate/).
  - title: {en: Distribution day, es: Día de entrega}
    body:
      en: We need hands in mid-December to sort and hand out. Email info@truckeecommunitycares.com.
      es: Necesitamos manos a mediados de diciembre para organizar y entregar. Escriba a info@truckeecommunitycares.com.
