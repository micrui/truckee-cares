title: {en: Help for your family this holiday season, es: Ayuda para su familia en estas fiestas}
lead:
  en: Grocery gift cards, a toy for each child, and warm coats. Free, for families in Truckee and Soda Springs.
  es: Tarjetas para el súper, un juguete para cada niño y abrigos. Gratis, para familias de Truckee y Soda Springs.
apply_cta: {en: Apply for help, es: Solicitar ayuda}
apply_sub:
  en: About 5 minutes on your phone. Spanish or English.
  es: Unos 5 minutos en su celular. En español o inglés.
help_title:
  en: "Need a hand? A volunteer can help you apply."
  es: "¿Necesita ayuda? Un voluntario le ayuda a llenar la solicitud."
help_call: {en: Call, es: Llamar}
help_text: {en: Text, es: Texto}
how_title: {en: How it works, es: Cómo funciona}
how:
  - title: {en: Apply, es: Solicite}
    text:
      en: Answer a few short questions. One application per family.
      es: Conteste unas preguntas cortas. Una solicitud por familia.
  - title: {en: We confirm, es: Confirmamos}
    text:
      en: If we can help, you get a text and a letter in early December.
      es: Si podemos ayudar, recibirá un texto y una carta a principios de diciembre.
  - title: {en: Pick up, es: Recoja}
    text:
      en: Bring your letter on pickup day in mid-December.
      es: Traiga su carta el día de la entrega a mediados de diciembre.
donate_title:
  en: "Want to help a neighbor?"
  es: "¿Quiere ayudar a un vecino?"
donate_cta: {en: Donate, es: Donar}
donate_sub:
  en: Every dollar goes to gift cards, toys and coats.
  es: Cada dólar se convierte en tarjetas, juguetes y abrigos.
