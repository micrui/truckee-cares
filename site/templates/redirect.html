<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Truckee Community Cares</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ base }}/static/css/site.css?v={{ asset_v }}">
<script>
  // Send the visitor to their language. Spanish speakers get /es/, everyone else /en/.
  // A stored choice (set by the language switch) wins over the browser setting.
  (function () {
    var base = "{{ base }}";
    var stored = null;
    try { stored = localStorage.getItem("tcc-lang"); } catch (e) {}
    var lang = (stored === "en" || stored === "es") ? stored
      : ((navigator.language || "").toLowerCase().indexOf("es") === 0 ? "es" : "en");
    var path = location.pathname;
    if (base && path.indexOf(base + "/") === 0) path = path.slice(base.length);
{% if is_404 %}
    // This is the 404 page. Old Wix addresses still circulate on flyers and in search
    // results, so map them to the new pages first. Targets end with a slash.
    var aliases = {
      "applicants": "apply/", "our-programs": "programs/", "our-team": "about/",
      "partner-organizations": "about/", "sponsors": "about/", "donate": "donate/",
      "volunteer": "volunteer/", "photos": "", "news": "", "calendar": ""
    };
    var m = path.match(/^\/([a-z-]+)\/?$/);
    if (m && aliases.hasOwnProperty(m[1])) {
      location.replace(base + "/" + lang + "/" + aliases[m[1]]);
      return;
    }
    // Already inside /en/ or /es/: the page really does not exist. Redirecting again
    // would loop back here. Stay, and point the apply button at that language.
    if (/^\/(en|es)\//.test(path)) {
      var urlLang = path.slice(1, 3);
      document.addEventListener("DOMContentLoaded", function () {
        var a = document.getElementById("apply-link");
        if (a) a.href = base + "/" + urlLang + "/apply/";
      });
      return;
    }
{% endif %}
    path = path.replace(/^\/(en|es)(\/|$)/, "/");
    if (path === "" || path === "/index.html") path = "/";
    if (path.charAt(path.length - 1) !== "/") path += "/";
    location.replace(base + "/" + lang + path);
  })();
</script>
</head>
<body>
<main class="wrap">
  <h1>Truckee Community Cares</h1>
{% if is_404 %}
  <p>That page does not exist. Pick a language, or go straight to the form.<br>
     Esa página no existe. Elija un idioma o vaya directo al formulario.</p>
{% endif %}
  <p><a class="btn btn-primary btn-big" href="{{ base }}/en/">English</a>
     <a class="btn btn-primary btn-big" href="{{ base }}/es/">Español</a></p>
{% if is_404 %}
  <p><a id="apply-link" class="btn btn-secondary btn-big" href="{{ base }}/en/apply/">Apply for help / Solicitar ayuda</a></p>
{% endif %}
</main>
</body>
</html>
