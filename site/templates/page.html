{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ s.org }}{% endblock %}
{% block main %}
<article class="prose">
  <h1>{{ page.title }}</h1>
  {% for sec in page.sections %}
  <section>
    <h2>{{ sec.title }}</h2>
    {{ sec.body | md | safe }}
  </section>
  {% endfor %}
</article>
{% endblock %}
